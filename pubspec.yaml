name: toy_village_app
description: "토이빌리지 모바일 앱입니다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2951.0
  go_router: ^17.3.0
  flutter_material_design_icons: ^3.1.0+7447
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  table_calendar: ^3.2.0
  skeletonizer: ^2.1.3
  webview_flutter: ^4.14.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  gal: ^2.3.2
  flutter_file_downloader: ^2.1.1
  dotted_border: ^3.1.0
  image_picker: ^1.2.3
  file_picker: ^10.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: WantedSans
      fonts:
        - asset: assets/font/WantedSans-Black.ttf
          weight: 900
        - asset: assets/font/WantedSans-ExtraBold.ttf
          weight: 800
        - asset: assets/font/WantedSans-Bold.ttf
          weight: 700
        - asset: assets/font/WantedSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/WantedSans-Medium.ttf
          weight: 500
        - asset: assets/font/WantedSans-Regular.ttf
          weight: 400

  assets:
    - assets/svg/
    - assets/svg/bottom_icon/

dependency_overrides:
  path_provider_foundation: 2.4.1
